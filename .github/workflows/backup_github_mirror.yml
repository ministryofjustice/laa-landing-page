name: Backup - GitHub mirror

# Weekly mirror of this repo and its metadata to the prd backup bucket.

on:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mirror-backup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ministryofjustice/laa-landing-page
    steps:
      - name: Mirror-clone this repository
        run: git clone --mirror "https://github.com/${REPO}.git" repo-mirror.git

      - name: Mirror-clone the wiki (tolerant — no pages exist yet)
        continue-on-error: true
        run: git clone --mirror "https://github.com/${REPO}.wiki.git" wiki-mirror.git

      - name: Export metadata — issues, PRs, releases, labels, milestones
        run: |
          mkdir -p metadata
          gh api "repos/${REPO}/issues?state=all&per_page=100" --paginate > metadata/issues.json
          gh api "repos/${REPO}/pulls?state=all&per_page=100" --paginate > metadata/pulls.json
          gh api "repos/${REPO}/releases?per_page=100" --paginate > metadata/releases.json
          gh api "repos/${REPO}/labels?per_page=100" --paginate > metadata/labels.json
          gh api "repos/${REPO}/milestones?state=all&per_page=100" --paginate > metadata/milestones.json

      - name: Download release assets
        run: |
          mkdir -p release-assets
          gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' | \
            while read -r tag; do
              gh release download "$tag" --repo "$REPO" --dir "release-assets/$tag" --clobber || true
            done

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BACKUP_GH_APP_ID }}
          private-key: ${{ secrets.BACKUP_GH_APP_PRIVATE_KEY }}
          owner: ministryofjustice
          repositories: laa-landing-page

      - name: Export metadata requiring elevated access — rulesets, environments, repo settings, collaborators, variables, secret names
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p metadata
          gh api "repos/${REPO}/rulesets?includes_parents=true" --paginate > metadata/rulesets.json
          for id in $(gh api "repos/${REPO}/rulesets" --jq '.[].id'); do
            gh api "repos/${REPO}/rulesets/$id" > "metadata/ruleset-$id.json"
          done
          gh api "repos/${REPO}/environments" --paginate > metadata/environments.json
          gh api "repos/${REPO}" > metadata/repo-settings.json
          gh api "repos/${REPO}/topics" > metadata/topics.json
          gh api "repos/${REPO}/collaborators?per_page=100" --paginate > metadata/collaborators.json
          gh api "repos/${REPO}/actions/variables?per_page=100" --paginate > metadata/actions-variables.json
          gh api "repos/${REPO}/actions/organization-variables?per_page=100" --paginate > metadata/actions-variables-org.json
          for env in development test production; do
            gh api "repos/${REPO}/environments/${env}/variables?per_page=100" --paginate > "metadata/actions-variables-env-${env}.json"
          done

          # Secret NAMES only — the API never returns values, so this is safe to export.
          gh api "repos/${REPO}/actions/secrets?per_page=100" --paginate --jq '.secrets[].name' > metadata/secret-names-repo.json
          gh api "repos/${REPO}/actions/organization-secrets?per_page=100" --paginate --jq '.secrets[].name' > metadata/secret-names-org.json
          for env in development test production; do
            gh api "repos/${REPO}/environments/${env}/secrets?per_page=100" --paginate --jq '.secrets[].name' > "metadata/secret-names-env-${env}.json"
          done

      - name: Tar everything
        run: |
          paths="repo-mirror.git metadata release-assets"
          [ -d wiki-mirror.git ] && paths="$paths wiki-mirror.git"
          tar -czf "github-mirror-$(date -u +%Y%m%dT%H%M%SZ).tar.gz" $paths

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.BACKUP_S3_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.BACKUP_S3_REGION }}

      - name: Upload tarball to the backup bucket
        run: |
          aws s3 cp github-mirror-*.tar.gz \
            "s3://${{ vars.BACKUP_S3_BUCKET_NAME }}/github-mirror/"
