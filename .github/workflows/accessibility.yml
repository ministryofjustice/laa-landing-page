name: Pa11y Accessibility Tests

on:
  workflow_run:
    workflows: ["Deploy Dev"]
    types:
      - completed
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pa11y:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Only if deploy succeeds
    runs-on: ubuntu-latest
    environment: development
    env:
      NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      ENTRA_USERNAME: ${{ secrets.ENTRA_USERNAME }}
      ENTRA_PASSWORD: ${{ secrets.ENTRA_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Install Pa11y and Puppeteer
        run: npm ci

      - name: Run Pa11y with Puppeteer
        run: npm run test:accessibility
        
