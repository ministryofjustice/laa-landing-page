name: Gitleaks secret scan

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
  schedule:
    - cron: "53 1 * * *" # run once a day at 01:53 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: gitleaks
    # Skip for Dependabot PRs - GITLEAKS_LICENSE is not available to Dependabot,
    # and action-version bumps are not a source of committed secrets.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free organisation license key, another can be obtained at https://gitleaks.io/
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Notify production Slack channel
        if: ${{ always() && github.event_name == 'schedule' && steps.gitleaks.outcome == 'failure' }}
        env:
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_PRD_ALERT_WEBHOOK_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "text": (
                  f":rotating_light: Gitleaks scheduled scan did not pass for "
                  f"`{os.environ['GITHUB_REPOSITORY']}`. "
                  "Check the run to see whether a secret was detected or the scan failed."
              ),
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": (
                              f":rotating_light: *Gitleaks scheduled scan did not pass* for "
                              f"`{os.environ['GITHUB_REPOSITORY']}`.\n"
                              "Review the run to determine whether a secret was detected "
                              "or the scan failed."
                          ),
                      },
                  },
                  {
                      "type": "actions",
                      "elements": [
                          {
                              "type": "button",
                              "text": {"type": "plain_text", "text": "View scan run"},
                              "url": os.environ["GITHUB_RUN_URL"],
                          }
                      ],
                  },
              ],
          }
          request = urllib.request.Request(
              os.environ["SLACK_ALERT_WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              response.read()
          PY
