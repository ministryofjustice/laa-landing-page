name: ASH Scan

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, edited ]
  schedule:
    - cron: '20 03 * * 6'
  workflow_dispatch:

jobs:
  ash:
    uses: awslabs/automated-security-helper/.github/workflows/run-ash-security-scan.yml@v3
    permissions:
      actions: read # Required for CodeQL action API access during SARIF upload in the called workflow
      contents: read # Required to read the repository contents in order to scan them with ASH
      checks: write # Required for writing CI check runs
      pull-requests: write # Required for writing comments with scan results to pull requests
      security-events: write # Required for collection of SARIF code scanning results for GitHub Advanced Security checks
    with:
      ash-version: v3
      ash-mode: container
      config: .ash/ash.yaml
      fail-on-findings: true
      collect-junit-xml-report: false
      collect-sarif-report: true
      install-grype: true
      install-syft: true
      install-opengrep: true
      post-pr-comment: ${{ github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
      verbose: true
      output-dir: '.ash/ash_output'

  check-ash-findings:
    name: Check ASH Findings
    runs-on: ubuntu-latest
    needs: ash
    if: always()
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ash_output
          path: .ash/ash_output

      - name: Verify ASH findings
        run: |
          set +e
          echo "Checking for HIGH or CRITICAL findings in ASH output..."
          echo "Contents of .ash/ash_output:"
          find .ash/ash_output -type f 2>/dev/null
          
          # Check for SARIF files and look for error/warning level findings
          SARIF_FILES=$(find .ash/ash_output -name "*.sarif" -type f 2>/dev/null)
          if [ -z "$SARIF_FILES" ]; then
            echo "ℹ️  No SARIF files found - ASH likely has no findings"
            exit 0
          fi
          
          echo -e "\n=== Processing SARIF reports ==="
          FOUND_CRITICAL=0
          
          for SARIF_FILE in $SARIF_FILES; do
            echo "Checking: $SARIF_FILE"
            
            # Count results with error level (CRITICAL) - be strict with the pattern
            ERROR_COUNT=$(grep -o '"level" *: *"error"' "$SARIF_FILE" 2>/dev/null | wc -l)
            
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "❌ Found $ERROR_COUNT CRITICAL (error level) findings in $SARIF_FILE"
              FOUND_CRITICAL=1
            else
              echo "✅ No CRITICAL findings in $SARIF_FILE"
            fi
          done
          
          if [ "$FOUND_CRITICAL" -eq 1 ]; then
            echo -e "\n❌ Pipeline failed: CRITICAL security findings detected"
            exit 1
          else
            echo -e "\n✅ ASH scan passed - no CRITICAL findings"
            exit 0
          fi

  syft-image-scan:
    name: Syft Image Scan
    runs-on: ubuntu-latest
    needs: check-ash-findings
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build JAR
        run: ./gradlew build
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: ${{ vars.ENV_NAME }}

      - name: Build Docker image
        run: docker build -t laa-landing-page:scan .

      - name: Generate Syft SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: laa-landing-page:scan
          format: syft-json
          output-file: 'syft-image-sbom.json'
          artifact-name: 'syft-image-sbom'

      - name: Generate Syft SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: laa-landing-page:scan
          format: spdx-json
          output-file: 'syft-image-spdx.json'
          artifact-name: 'syft-image-sbom-spdx'

  upload-sarif:
    name: Upload ASH SARIF
    needs: ash
    if: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download ASH output artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.01
        with:
          name: ash_output
          path: .ash/ash_output

      - name: Upload ASH SARIF file
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: .ash/ash_output/reports/ash.sarif
          wait-for-processing: true
          category: ash
