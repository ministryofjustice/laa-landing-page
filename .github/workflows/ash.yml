name: ASH Scan

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, edited ]
  schedule:
    - cron: '20 03 * * 6'
  workflow_dispatch:

jobs:
  ash:
    # Skip for Dependabot PRs - SAST on a GitHub Actions version bump adds little, and
    # the SARIF upload is not permitted for Dependabot. Scheduled/push runs cover main.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: awslabs/automated-security-helper/.github/workflows/run-ash-security-scan.yml@v3
    permissions:
      actions: read # Required for CodeQL action API access during SARIF upload in the called workflow
      contents: read # Required to read the repository contents in order to scan them with ASH
      checks: write # Required for writing CI check runs
      pull-requests: write # Required for writing comments with scan results to pull requests
      security-events: write # Required for collection of SARIF code scanning results for GitHub Advanced Security checks
    with:
      ash-version: v3
      ash-mode: container
      config: .ash/ash.yaml
      # NOTE: currently a no-op upstream - run-ash-security-scan.yml evaluates
      # `inputs.fail-on-findings == 'true'`, a boolean-vs-string compare that is
      # always false, so ASH always runs with --no-fail-on-findings. The
      # check-ash-findings job below is the real gate. Left set to true for intent
      # and in case upstream fixes the comparison.
      fail-on-findings: true
      collect-junit-xml-report: false
      collect-sarif-report: false
      install-grype: true
      install-syft: true
      install-opengrep: true
      post-pr-comment: ${{ github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
      verbose: true
      output-dir: '.ash/ash_output'

  check-ash-findings:
    name: Check ASH Findings
    runs-on: ubuntu-latest
    needs: ash
    # always() so a failed (not skipped) ash job is still gated; drop out for Dependabot
    # PRs where ash is skipped and no results artifact exists.
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ash_output
          path: .ash/ash_output

      - name: Verify ASH findings
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${{ github.workspace }}/.ash/ash_output"
          results_json="$output_dir/ash_aggregated_results.json"

          echo "ASH output files:"
          find "$output_dir" -maxdepth 2 -type f 2>/dev/null | sort || true
          echo

          # Fail closed: no machine-readable results means the scan did not
          # complete, and the pipeline must not pass silently.
          if [ ! -f "$results_json" ]; then
            echo "::error::ASH did not produce $results_json - failing closed."
            exit 1
          fi

          # The severity gate is configured in .ash/ash.yaml
          # (global_settings.severity_threshold). ASH's own "actionable" count is
          # the number of findings at or above that threshold, so gate on it
          # directly rather than re-deriving severity ranking here.
          actionable=$(jq -r '.metadata.summary_stats.actionable // 0' "$results_json")
          total=$(jq -r '.metadata.summary_stats.total // 0' "$results_json")

          echo "Findings by severity (after suppressions):"
          jq -r '(.metadata.summary_stats.severity_counts // {})
                 | to_entries[] | "  \(.key): \(.value)"' "$results_json"
          echo "Total findings: $total"
          echo "Actionable findings (at or above configured threshold): $actionable"
          echo

          # A scanner that errored or is missing its dependencies leaves a
          # coverage gap - treat that as a failure, not a pass.
          broken=$(jq -r '[.scanner_results // {}
                           | to_entries[]
                           | select(.value.status == "ERROR" or .value.status == "MISSING")
                           | "\(.key) (\(.value.status))"] | join(", ")' "$results_json")

          rc=0

          if [ "$actionable" -gt 0 ]; then
            echo "::error::ASH reported $actionable actionable finding(s) at or above the configured severity threshold."
            echo "Scanners with actionable findings:"
            jq -r '.scanner_results // {}
                   | to_entries[]
                   | select((.value.actionable_finding_count // 0) > 0)
                   | "  \(.key): \(.value.actionable_finding_count)"' "$results_json"
            rc=1
          fi

          if [ -n "$broken" ]; then
            echo "::error::ASH scanner(s) did not run cleanly: $broken"
            rc=1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "✅ No actionable ASH findings; all enabled scanners executed."
          fi

          exit "$rc"

  syft-image-scan:
    name: Syft Image Scan
    runs-on: ubuntu-latest
    needs: check-ash-findings
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Build JAR
        run: ./gradlew build
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: ${{ vars.ENV_NAME }}

      - name: Build Docker image
        run: docker build -t laa-landing-page:scan .

      - name: Generate Syft SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: laa-landing-page:scan
          format: syft-json
          output-file: 'syft-image-sbom.json'
          artifact-name: 'syft-image-sbom'

      - name: Generate Syft SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: laa-landing-page:scan
          format: spdx-json
          output-file: 'syft-image-spdx.json'
          artifact-name: 'syft-image-sbom-spdx'

  upload-sarif:
    name: Upload ASH SARIF
    needs: ash
    if: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download ASH output artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ash_output
          path: .ash/ash_output

      - name: Upload ASH SARIF file
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: .ash/ash_output/reports/ash.sarif
          wait-for-processing: true
          category: ash
