name: ASH Scan

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, edited ]
  schedule:
    - cron: '20 03 * * 6'
  workflow_dispatch:

jobs:
  ash:
    uses: awslabs/automated-security-helper/.github/workflows/run-ash-security-scan.yml@v3
    permissions:
      actions: read # Required for CodeQL action API access during SARIF upload in the called workflow
      contents: read # Required to read the repository contents in order to scan them with ASH
      checks: write # Required for writing CI check runs
      pull-requests: write # Required for writing comments with scan results to pull requests
      security-events: write # Required for collection of SARIF code scanning results for GitHub Advanced Security checks
    with:
      ash-version: v3
      ash-mode: container
      config: .ash/ash.yaml
      fail-on-findings: true
      collect-junit-xml-report: false
      collect-sarif-report: false
      install-grype: true
      install-syft: true
      install-opengrep: true
      post-pr-comment: ${{ github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
      verbose: true
      output-dir: '.ash/ash_output'

  check-ash-findings:
    name: Check ASH Findings
    runs-on: ubuntu-latest
    needs: ash
    if: always()
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ash_output
          path: .ash/ash_output

      - name: Verify ASH findings
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ASH findings against the configured severity threshold from .ash/ash.yaml..."
          echo "Contents of .ash/ash_output:"
          find .ash/ash_output -type f 2>/dev/null || true

          if [ ! -f .ash/ash.yaml ]; then
            echo "⚠️  No .ash/ash.yaml found; skipping threshold-based verification."
            exit 0
          fi

          threshold_raw=$(grep -E '^[[:space:]]*severity_threshold:[[:space:]]*(ALL|LOW|MEDIUM|HIGH|CRITICAL)[[:space:]]*$' .ash/ash.yaml | head -n 1 | sed -E 's/.*severity_threshold:[[:space:]]*//; s/[[:space:]]*$//' || true)
          threshold="${threshold_raw^^}"
          if [ -z "$threshold" ]; then
            echo "⚠️  Could not determine severity threshold from .ash/ash.yaml; defaulting to CRITICAL."
            threshold="CRITICAL"
          fi

          case "$threshold" in
            ALL) min_rank=0 ;;
            LOW) min_rank=1 ;;
            MEDIUM) min_rank=2 ;;
            HIGH) min_rank=3 ;;
            CRITICAL) min_rank=4 ;;
            *)
              echo "⚠️  Unsupported threshold '$threshold'; defaulting to CRITICAL."
              min_rank=4
              ;;
          esac

          echo "Configured threshold: $threshold"

          summary_reports=(
            ".ash/ash_output/reports/ash.summary.md"
            ".ash/ash_output/reports/ash.summary.txt"
            ".ash/ash_output/reports/ash.html"
          )

          found_summary=0
          for summary in "${summary_reports[@]}"; do
            if [ -f "$summary" ]; then
              found_summary=1
              echo "Using report: $summary"
              python3 - "$summary" "$threshold" <<'PY'
                import sys
                from pathlib import Path

                summary_path = Path(sys.argv[1])
                threshold = sys.argv[2].upper()

                lines = summary_path.read_text(encoding='utf-8', errors='ignore').splitlines()
                rows = []

                in_table = False
                for line in lines:
                    stripped = line.strip()
                    if not stripped.startswith("|"):
                        continue
                    if "Scanner" in stripped and "Result" in stripped and "Threshold" in stripped:
                        in_table = True
                        continue
                    if not in_table:
                        continue
                    if stripped.startswith("| ---"):
                        continue
                    if stripped.count("|") < 3:
                        continue

                    parts = [part.strip() for part in stripped.strip("|").split("|")]
                    if len(parts) < 11:
                        continue
                    if parts[0].lower() == "scanner":
                        continue

                    rows.append(parts)

                failures = []
                for parts in rows:
                    actionable = parts[8] if len(parts) > 8 else "0"
                    try:
                        actionable_count = int(actionable)
                    except ValueError:
                        actionable_count = 0
                    if actionable_count > 0:
                        failures.append((parts[0], actionable))

                if failures:
                    print(f"❌ Found {len(failures)} scanner(s) with actionable findings above the configured threshold {threshold}:")
                    for scanner, actionable in failures:
                        print(f"  - {scanner}: {actionable} actionable finding(s)")
                    sys.exit(1)

                if rows:
                    print(f"✅ No scanners reported actionable findings above the configured threshold {threshold}.")
                else:
                    print("ℹ️  No scanner rows found in the summary report.")
              PY
              exit $?
            fi
          done

          if [ "$found_summary" -eq 0 ]; then
            echo "ℹ️  No ASH summary report found; falling back to SARIF-based threshold evaluation."

            sarif_files=$(find .ash/ash_output -name "*.sarif" -type f 2>/dev/null)
            if [ -z "$sarif_files" ]; then
              echo "ℹ️  No SARIF files found - ASH did not produce a report to evaluate."
              exit 0
            fi

            python3 - "$threshold" <<'PY'
                import glob
                import json
                import sys

                threshold = sys.argv[1].upper()
                qualifying_levels = {
                    "ALL": {"error", "warning", "note", "none"},
                    "LOW": {"error", "warning", "note"},
                    "MEDIUM": {"error", "warning"},
                    "HIGH": {"error"},
                    "CRITICAL": {"error"},
                }
                qualifying = qualifying_levels.get(threshold, {"error"})

                count = 0
                for sarif_path in sorted(glob.glob(".ash/ash_output/**/*.sarif", recursive=True)):
                    with open(sarif_path, encoding="utf-8") as handle:
                        data = json.load(handle)
                    for run in data.get("runs", []):
                        for result in run.get("results", []):
                            if result.get("suppressions"):
                                continue
                            level = str(result.get("level") or "note").lower()
                            if level in qualifying:
                                count += 1

                if count > 0:
                    print(f"❌ Found {count} finding(s) above the configured threshold {threshold}.")
                    sys.exit(1)

                print(f"✅ No findings above the configured threshold {threshold}.")
            PY
          fi

  syft-image-scan:
    name: Syft Image Scan
    runs-on: ubuntu-latest
    needs: check-ash-findings
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build JAR
        run: ./gradlew build
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: ${{ vars.ENV_NAME }}

      - name: Build Docker image
        run: docker build -t laa-landing-page:scan .

      - name: Generate Syft SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: laa-landing-page:scan
          format: syft-json
          output-file: 'syft-image-sbom.json'
          artifact-name: 'syft-image-sbom'

      - name: Generate Syft SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: laa-landing-page:scan
          format: spdx-json
          output-file: 'syft-image-spdx.json'
          artifact-name: 'syft-image-sbom-spdx'

  upload-sarif:
    name: Upload ASH SARIF
    needs: ash
    if: ${{ github.actor != 'dependabot[bot]' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Download ASH output artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.01
        with:
          name: ash_output
          path: .ash/ash_output

      - name: Upload ASH SARIF file
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: .ash/ash_output/reports/ash.sarif
          wait-for-processing: true
          category: ash
