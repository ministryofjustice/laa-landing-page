name: Tests

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run Tests
    # Skip for Dependabot PRs - action-version bumps don't touch app code, and the
    # coverage/PR-comment steps need secrets and write permissions Dependabot lacks.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Run Coverage
        run: |
          ./gradlew test
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.TEST_TENANT_ID }}


      - name: Parse JaCoCo and Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1

          export CHANGED_FILES=$(git diff --name-only \
            "origin/$BASE_REF" HEAD | grep -E '\.(java|kt)$' || true)

          python3 <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(
              'build/reports/jacoco/test/jacocoTestReport.xml'
          ).getroot()

          def coverage(element):
              counter = next(
                  (c for c in element.findall('counter')
                   if c.get('type') == 'INSTRUCTION'),
                  None
              )
              if counter is None:
                  return None

              missed = int(counter.get('missed'))
              covered = int(counter.get('covered'))
              total = missed + covered
              pct = covered / total * 100 if total else 0
              return pct, missed

          def icon(pct):
              return '🟢' if pct >= 80 else (
                  '🟡' if pct >= 50 else '🔴'
              )

          def make_table(files):
              lines = [
                  '| File | Coverage | Missed Instructions |',
                  '|------|----------|---------------------|'
              ]
              for f in files:
                  name = f['name']
                  if f['changed']:
                      name = f'**{name} (changed)**'
                  lines.append(
                      f"| {name} | {icon(f['pct'])} "
                      f"{f['pct']:.2f}% | {f['missed']} |"
                  )
              return '\n'.join(lines) + '\n\n'

          # Overall coverage
          overall = coverage(root)
          overall_pct = overall[0] if overall else 0.0
          overall_icon = (
              '🟢' if overall_pct >= 85 else
              '🟡' if overall_pct >= 70 else '🔴'
          )

          heading = (
              f'### {overall_icon} JaCoCo Code Coverage: '
              f'**{overall_pct:.2f}%**\n\n'
          )

          # Changed Java/Kotlin source files
          changed = {
              path.split('/java/')[-1].split('/kotlin/')[-1]
              for path in os.environ.get('CHANGED_FILES', '').split()
              if '/java/' in path or '/kotlin/' in path
          }

          # Collect all files from JaCoCo
          files = []
          for pkg in root.findall('package'):
              pkg_name = pkg.get('name')
              for sf in pkg.findall('sourcefile'):
                  result = coverage(sf)
                  if result is None:
                      continue

                  name = f"{pkg_name}/{sf.get('name')}"
                  pct, missed = result

                  files.append({
                      'name': name,
                      'pct': pct,
                      'missed': missed,
                      'changed': name in changed
                  })

          changed_files = sorted(
              (f for f in files if f['changed']),
              key=lambda f: (f['pct'], f['name'])
          )
          unchanged_files = sorted(
              (f for f in files if not f['changed']),
              key=lambda f: (f['pct'], f['name'])
          )

          # Short PR comment
          comment = heading

          if changed_files:
              comment += '#### Changed Files\n\n'
              comment += make_table(changed_files)
          else:
              comment += (
                  '_No changed Java/Kotlin files with coverage data._\n\n'
              )

          comment += '#### 20 Lowest-Coverage Other Files\n\n'
          comment += make_table(unchanged_files[:20])

          comment += (
              '_Full file coverage is available in the '
              'GitHub Actions job summary._\n'
          )

          # Complete GitHub Actions summary
          summary = heading
          summary += (
              f'#### All Source Files ({len(files)})\n\n'
          )
          summary += make_table(
              changed_files + unchanged_files
          )

          with open(
              os.environ['GITHUB_STEP_SUMMARY'], 'a'
          ) as out:
              out.write(summary)

          with open('coverage_comment.md', 'w') as out:
              out.write(comment)

          # Preserve existing 85% coverage gate
          if overall_pct < 85.0:
              print(
                  f'::error::Overall unit test coverage '
                  f'({overall_pct:.2f}%) is less than 85%!'
              )
              sys.exit(1)
          PY

          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" \
              --body-file coverage_comment.md
          fi    
        
      - name: Run IntegrationTest
        run: |
          ./gradlew integrationTest

      - name: Run PlaywrightTest
        id: playwright
        continue-on-error: true
        run: |
          APP_PLAYWRIGHT_HEADLESS=true ./gradlew playwrightTest

      - name: Upload Playwright failure artifacts
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: |
            screenshots/**
            build/playwright-report.html

      - name: Fail job if Playwright tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
