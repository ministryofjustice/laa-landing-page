# PROPOSED — DB-2 (docs/backup-and-recovery-strategy.md). Closer to deployable as
# of 2026-09-14: each environment now has its own bucket + IRSA role in Terraform —
# cloud-platform-environments/.../laa-landing-page-{dev,test,prd}/resources/s3-backup.tf
# each create their own `module.backup` (bucket) and `module.irsa_pg_dump_backup`,
# whose generated ServiceAccount name matches
# `irsa-laa-landing-page-${ENV_NAME}-pg-dump-backup` below exactly. Since each
# environment has its own bucket, the S3 key below is just pg-dump/<timestamp>.dump
# — no per-environment sub-folder needed, the bucket itself provides that
# separation. Still not deployable until: (1) that Terraform is actually applied for
# a given environment (only dev exists so far), and (2) `deploy_test.yml` /
# `deploy_prd.yml` are wired the same way `deploy_dev.yml` now is (BACKUP_BUCKET_NAME
# read from that namespace's own backup-bucket-output secret).
#
# Image: ghcr.io/ministryofjustice/hmpps-devops-tools — confirmed by the user to
# carry both the AWS CLI and pg_dump. Pinned to :latest below as a placeholder;
# replace with a specific tag/digest before this goes anywhere near prd, and
# confirm its pg_dump version is >= the DB's PG16 (a pg_dump client older than
# the server it's dumping from is not guaranteed to work correctly).
#
# Schedule is a placeholder (Sunday 03:00 UTC) — DB-4 in the strategy doc wants
# explicit, non-overlapping backup/maintenance windows set on the RDS instance
# itself first; revisit this once those exist so the two don't collide.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-dump-backup-config
  namespace: ${NAMESPACE}
data:
  dump-and-upload.sh: |
    #!/bin/sh
    set -eu

    timestamp=$(date -u +%Y%m%dT%H%M%SZ)
    dump_file="/tmp/laa-landing-page-${ENV_NAME}-${timestamp}.dump"

    echo "Dumping ${DB_NAME} from ${DB_HOST}:${DB_PORT} (whole database, custom format)..."
    PGPASSWORD="${DB_PASSWORD}" pg_dump \
      --host="${DB_HOST}" \
      --port="${DB_PORT}" \
      --username="${DB_USER}" \
      --dbname="${DB_NAME}" \
      --format=custom \
      --file="${dump_file}"

    echo "Uploading to s3://${BACKUP_BUCKET_NAME}/pg-dump/${timestamp}.dump ..."
    aws s3 cp "${dump_file}" "s3://${BACKUP_BUCKET_NAME}/pg-dump/${timestamp}.dump"

    rm -f "${dump_file}"
    echo "Done."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump-backup
  namespace: ${NAMESPACE}
spec:
  schedule: "0 3 * * 0" # Weekly, Sunday 03:00 UTC — placeholder, see header comment
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: "irsa-laa-landing-page-${ENV_NAME}-pg-dump-backup"
          securityContext:
            runAsUser: 10000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false # IRSA injects its own token volume
          containers:
            - name: pg-dump-backup
              image: ghcr.io/ministryofjustice/hmpps-devops-tools:latest # TODO: pin before prd
              imagePullPolicy: Always
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: ENV_NAME
                  value: "${ENV_NAME}"
                - name: BACKUP_BUCKET_NAME
                  value: "${BACKUP_BUCKET_NAME}"
                - name: DB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-readonly-output
                      key: rds_instance_address
                - name: DB_PORT
                  value: "5432" # No custom port set in rds.tf — update if that changes
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-readonly-output
                      key: database_name
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-readonly-output
                      key: database_username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rds-postgresql-instance-readonly-output
                      key: database_password
              volumeMounts:
                - name: config
                  mountPath: /etc/config
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/sh
                - /etc/config/dump-and-upload.sh
          volumes:
            - name: config
              configMap:
                name: pg-dump-backup-config
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
          restartPolicy: Never
