# Override secure=true false for localhost
server.servlet.session.cookie.secure=false

# OBO debug endpoint (hit /debug/user-data-api/hello and /debug/user-data-api/me)
app.test.user-data-api.enabled=true

# Disable live data API calls locally — uses DoNothingUserDataApiClient
