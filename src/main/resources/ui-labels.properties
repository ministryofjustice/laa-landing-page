# =============================================================================
# UI Labels — centralised terminology for consistent display across templates
# =============================================================================
#
# PURPOSE
#   This file is the single source of truth for user-facing labels and
#   terminology in SiLAS. Keeping labels here (separate from infrastructure
#   config in application.properties) means content changes never require
#   touching operational configuration.
#
# HOW TO ADD A NEW LABEL
#   1. Add a property below using the app.ui.labels.* prefix.
#   2. Add a matching field with the same default value to UiLabelsProperties.
#   3. Reference it in Thymeleaf templates via ${uiLabels.yourFieldName}.
#
# NAMING CONVENTIONS
#   - Property keys  : kebab-case   e.g. app.ui.labels.office-account-number
#   - Java fields    : camelCase    e.g. officeAccountNumber
#   - Template refs  : ${uiLabels.officeAccountNumber}
#
# ENVIRONMENT-SPECIFIC OVERRIDES
#   To change a label for a specific environment, add the same key to the
#   profile properties file (e.g. application-local.properties).
#   No code changes are required in consuming templates or services.
#
# FALLBACK BEHAVIOUR
#   Each label has a default value set on the field in UiLabelsProperties.
#   If a key is missing from this file, the field default is used silently.
# =============================================================================

# --- Provider / Office ---

# Label for the unique account number associated with a provider office.
# Displayed as a column heading and as visually-hidden text alongside office codes.
app.ui.labels.office-account-number=Office account number

# --- Firm ---

# Name of a provider firm. Canonical casing is sentence-case.
app.ui.labels.firm-name=Firm name

# --- User ---

# Standard user attribute labels used in summary lists and table headers.
app.ui.labels.first-name=First name
app.ui.labels.last-name=Last name
app.ui.labels.email=Email

# Classification of a user (e.g. Internal / External). Canonical casing is sentence-case.
app.ui.labels.user-type=User type

# Generic status column heading used in user and firm tables.
app.ui.labels.status=Status
