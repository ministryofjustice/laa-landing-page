databaseChangeLog:

  # External User Support test user
  - changeSet:
      id: 1770000000000-1
      author: chris.marron
      context: playwright
      changes:

        # Create Entra user
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO entra_user (
                id,
                email,
                first_name,
                last_name,
                entra_oid,
                status,
                multi_firm_user,
                created_by,
                last_modified_by,
                created_date,
                last_modified_date
              )
              VALUES (
                gen_random_uuid(),
                'playwright-externalusersupport@playwrighttest.com',
                'Playwright',
                'ExternalUserSupport',
                gen_random_uuid(),
                'ACTIVE',
                false,
                'System',
                'System',
                NOW(),
                NOW()
              );

        # Create internal user profile
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile (
                id,
                entra_user_id,
                active_profile,
                status,
                user_type,
                created_date,
                last_modified_date,
                created_by,
                last_modified_by,
                last_sync_successful
              )
              VALUES (
                gen_random_uuid(),
                (
                  SELECT id
                  FROM entra_user
                  WHERE email = 'playwright-externalusersupport@playwrighttest.com'
                ),
                true,
                'COMPLETE',
                'INTERNAL',
                NOW(),
                NOW(),
                'System',
                'System',
                false
              );

        # Assign External User Support role
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile_app_role (
                user_profile_id,
                app_role_id
              )
              VALUES (
                (
                  SELECT up.id
                  FROM user_profile up
                  JOIN entra_user u
                    ON up.entra_user_id = u.id
                  WHERE u.email = 'playwright-externalusersupport@playwrighttest.com'
                ),
                (
                  SELECT id
                  FROM app_role
                  WHERE name = 'External User Support'
                )
              );