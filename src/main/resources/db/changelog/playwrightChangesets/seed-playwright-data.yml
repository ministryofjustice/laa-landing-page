  # Reactivate link regression users
  - changeSet:
      id: 1772010000000-20
      author: chris.marron
      context: playwright
      comment: "Seed Entra-disabled users who are not SiLAS Deactivated"
      changes:

        # ------------------------------------------------------------
        # Create the two Entra-disabled target users
        # ------------------------------------------------------------
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO entra_user (
                  id,
                  email,
                  first_name,
                  last_name,
                  entra_oid,
                  status,
                  enabled,
                  multi_firm_user,
                  created_by,
                  last_modified_by,
                  created_date,
                  last_modified_date
              )
              VALUES
              (
                  gen_random_uuid(),
                  'playwright-reactivation-incomplete@playwrighttest.com',
                  'Playwright',
                  'ReactivationIncomplete',
                  gen_random_uuid(),
                  'ACTIVE',
                  false,
                  false,
                  'System',
                  'System',
                  NOW(),
                  NOW()
              ),
              (
                  gen_random_uuid(),
                  'playwright-reactivation-awaiting@playwrighttest.com',
                  'Playwright',
                  'ReactivationAwaiting',
                  gen_random_uuid(),
                  'ACTIVE',
                  false,
                  false,
                  'System',
                  'System',
                  NOW(),
                  NOW()
              );


        # ------------------------------------------------------------
        # Create PENDING external profiles in Automation Firm One
        # ------------------------------------------------------------
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile (
                  id,
                  entra_user_id,
                  firm_id,
                  active_profile,
                  status,
                  user_type,
                  created_date,
                  last_modified_date,
                  created_by,
                  last_modified_by,
                  last_sync_successful,
                  unrestricted_office_access
              )
              SELECT
                  gen_random_uuid(),
                  eu.id,
                  '11111111-1111-1111-1111-111111111111',
                  true,
                  'PENDING',
                  'EXTERNAL',
                  NOW(),
                  NOW(),
                  'System',
                  'System',
                  false,
                  true
              FROM entra_user eu
              WHERE eu.email IN (
                  'playwright-reactivation-incomplete@playwrighttest.com',
                  'playwright-reactivation-awaiting@playwrighttest.com'
              );


        # ------------------------------------------------------------
        # Give only the Awaiting Verification user a role
        #
        # No role:
        #   Manage Users status = INCOMPLETE
        #
        # Role assigned but not activated:
        #   Manage Users status = ACTIVATION PENDING
        #   SiLAS Account Status = Awaiting verification
        # ------------------------------------------------------------
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile_app_role (
                  user_profile_id,
                  app_role_id
              )
              VALUES (
                  (
                      SELECT up.id
                      FROM user_profile up
                      JOIN entra_user eu
                          ON eu.id = up.entra_user_id
                      WHERE eu.email =
                          'playwright-reactivation-awaiting@playwrighttest.com'
                  ),
                  (
                      SELECT id
                      FROM app_role
                      WHERE name = 'External User Viewer'
                  )
              );
