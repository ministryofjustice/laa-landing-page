databaseChangeLog:

  # ------------------------------------------------------------------
  # Audit detail - user for whom the Playwright-only TechServicesClient
  # override simulates a failed (isSuccess()==false) Tech Services/Entra
  # API response. Used to verify AuditController degrades gracefully
  # (friendly banner, HTTP 200) rather than returning a 500.
  # ------------------------------------------------------------------
  - changeSet:
      id: create-audit-entra-error-test-user-1
      author: playwright-automation
      context: playwright
      changes:

        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO entra_user (
                  id,
                  email,
                  first_name,
                  last_name,
                  entra_oid,
                  status,
                  enabled,
                  multi_firm_user,
                  created_by,
                  last_modified_by,
                  created_date,
                  last_modified_date,
                  invitation_status
              )
              SELECT
                  gen_random_uuid(),
                  'playwright-audit-entra-error@playwrighttest.com',
                  'Playwright',
                  'AuditEntraError',
                  gen_random_uuid(),
                  'ACTIVE',
                  true,
                  false,
                  'System',
                  'System',
                  NOW(),
                  NOW(),
                  'VERIFICATION_SUCCESS'
              WHERE NOT EXISTS (
                  SELECT 1
                  FROM entra_user
                  WHERE email = 'playwright-audit-entra-error@playwrighttest.com'
              );

        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile (
                  id,
                  entra_user_id,
                  firm_id,
                  active_profile,
                  status,
                  silas_status,
                  user_type,
                  created_date,
                  last_modified_date,
                  created_by,
                  last_modified_by,
                  last_sync_successful,
                  unrestricted_office_access
              )
              SELECT
                  gen_random_uuid(),
                  eu.id,
                  '11111111-1111-1111-1111-111111111111',
                  true,
                  'COMPLETE',
                  'COMPLETE',
                  'EXTERNAL',
                  NOW(),
                  NOW(),
                  'System',
                  'System',
                  false,
                  true
              FROM entra_user eu
              WHERE eu.email = 'playwright-audit-entra-error@playwrighttest.com'
                AND NOT EXISTS (
                    SELECT 1
                    FROM user_profile up
                    WHERE up.entra_user_id = eu.id
                );

