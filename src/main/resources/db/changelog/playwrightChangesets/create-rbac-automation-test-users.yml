  - changeSet:
      id: create-office-management-automation-test-user-1
      author: chris.marron
      context: playwright
      changes:

        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO entra_user (
                  id,
                  email,
                  first_name,
                  last_name,
                  entra_oid,
                  status,
                  enabled,
                  multi_firm_user,
                  created_by,
                  last_modified_by,
                  created_date,
                  last_modified_date,
                  invitation_status
              )
              SELECT
                  gen_random_uuid(),
                  'playwright-office-management-test@playwrighttest.com',
                  'Playwright',
                  'OfficeManagementTest',
                  gen_random_uuid(),
                  'ACTIVE',
                  true,
                  false,
                  'System',
                  'System',
                  NOW(),
                  NOW(),
                  'VERIFICATION_SUCCESS'
              WHERE NOT EXISTS (
                  SELECT 1
                  FROM entra_user
                  WHERE email = 'playwright-office-management-test@playwrighttest.com'
              );

        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile (
                  id,
                  entra_user_id,
                  firm_id,
                  active_profile,
                  status,
                  silas_status,
                  user_type,
                  created_date,
                  last_modified_date,
                  created_by,
                  last_modified_by,
                  last_sync_successful,
                  unrestricted_office_access
              )
              SELECT
                  gen_random_uuid(),
                  eu.id,
                  '11111111-1111-1111-1111-111111111111',
                  true,
                  'COMPLETE',
                  'COMPLETE',
                  'EXTERNAL',
                  NOW(),
                  NOW(),
                  'System',
                  'System',
                  false,
                  true
              FROM entra_user eu
              WHERE eu.email = 'playwright-office-management-test@playwrighttest.com'
                AND NOT EXISTS (
                    SELECT 1
                    FROM user_profile up
                    WHERE up.entra_user_id = eu.id
                );
  - changeSet:
      id: create-office-management-automation-test-user-2
      author: chris.marron
      context: playwright
      changes:

        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile_app_role (
                  user_profile_id,
                  app_role_id
              )
              SELECT
                  up.id,
                  ar.id
              FROM entra_user eu
              JOIN user_profile up
                  ON up.entra_user_id = eu.id
              JOIN app_role ar
                  ON ar.name = 'Firm User Manager'
                 AND ar.authz_role = true
              WHERE eu.email =
                    'playwright-office-management-test@playwrighttest.com'
                AND NOT EXISTS (
                    SELECT 1
                    FROM user_profile_app_role existing_role
                    WHERE existing_role.user_profile_id = up.id
                      AND existing_role.app_role_id = ar.id
                );