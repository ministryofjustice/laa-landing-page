databaseChangeLog:

  # Global Admin - External User Support role target
  - changeSet:
      id: create-rbac-automation-test-users-1
      author: chris.marron
      context: playwright
      changes:

        # Create Entra user
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO entra_user (
                id,
                email,
                first_name,
                last_name,
                entra_oid,
                status,
                multi_firm_user,
                created_by,
                last_modified_by,
                created_date,
                last_modified_date
              )
              VALUES (
                gen_random_uuid(),
                'playwright-rbac-ga-eus-role@playwrighttest.com',
                'Playwright',
                'RbacGaEusRole',
                gen_random_uuid(),
                'ACTIVE',
                false,
                'System',
                'System',
                NOW(),
                NOW()
              );

        # Create internal user profile
        - sql:
            dbms: postgresql
            sql: |
              INSERT INTO user_profile (
                id,
                entra_user_id,
                active_profile,
                status,
                user_type,
                created_date,
                last_modified_date,
                created_by,
                last_modified_by,
                last_sync_successful
              )
              VALUES (
                gen_random_uuid(),
                (
                  SELECT id
                  FROM entra_user
                  WHERE email = 'playwright-rbac-ga-eus-role@playwrighttest.com'
                ),
                true,
                'COMPLETE',
                'INTERNAL',
                NOW(),
                NOW(),
                'System',
                'System',
                false
              );


