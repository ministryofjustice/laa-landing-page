databaseChangeLog:
  - changeSet:
      id: 20260811-1-remove-manage-reactivate-request-from-external-user-support
      author: sankavi-moj
      dbms: postgresql
      comment: "Add REINVITE_EXTERNAL_USER permission to External User Support role"
      changes:
        - sql:
            dbms: postgresql
            sql: "INSERT INTO role_permission (app_role_id, permission) VALUES ((SELECT id FROM app_role WHERE name = 'External User Support'), 'REINVITE_EXTERNAL_USER')"
      rollback:
        - sql:
            dbms: postgresql
            sql: "DELETE FROM role_permission WHERE permission = 'REINVITE_EXTERNAL_USER' AND app_role_id = (SELECT id FROM app_role WHERE name = 'External User Support')"
