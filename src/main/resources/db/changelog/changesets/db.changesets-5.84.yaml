databaseChangeLog:
  - changeSet:
      id: add-last-logged-in-to-silas-column
      author: joshua.halladey
      comment: "Add last_logged_in_to_silas timestamp column to user_profile table for tracking successful SiLAS logins"
      changes:
        - addColumn:
            tableName: user_profile
            columns:
              - column:
                  name: last_logged_in_to_silas
                  type: timestamp
                  remarks: "Timestamp of the user's most recent successful login to SiLAS"
      rollback:
        - dropColumn:
            tableName: user_profile
            columnName: last_logged_in_to_silas
