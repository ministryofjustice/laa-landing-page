databaseChangeLog:
  - changeSet:
      id: 1786102293409
      author: joshua.halladey
      comment: "Update status_change values from ENABLED/DISABLED to ACTIVATED/DEACTIVATED"

      changes:
        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE user_account_status_audit
              DROP CONSTRAINT user_account_status_audit_status_change_check

        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE user_account_status_audit
              ADD CONSTRAINT user_account_status_audit_status_change_check
              CHECK (
                status_change IN (
                  'ENABLED',
                  'DISABLED',
                  'DELETED',
                  'ACTIVATED',
                  'DEACTIVATED'
                )
              )

        - sql:
            dbms: postgresql
            sql: >
              UPDATE user_account_status_audit
              SET status_change = 'ACTIVATED'
              WHERE status_change = 'ENABLED'

        - sql:
            dbms: postgresql
            sql: >
              UPDATE user_account_status_audit
              SET status_change = 'DEACTIVATED'
              WHERE status_change = 'DISABLED'

        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE user_account_status_audit
              DROP CONSTRAINT user_account_status_audit_status_change_check

        - sql:
            dbms: postgresql
            sql: >
              ALTER TABLE user_account_status_audit
              ADD CONSTRAINT user_account_status_audit_status_change_check
              CHECK (
                status_change IN (
                  'ACTIVATED',
                  'DEACTIVATED',
                  'DELETED'
                )
              )