databaseChangeLog:
  - changeSet:
      id: 20260901-1-grant-external-user-support-role-assignment
      author: paul.snowdon
      dbms: postgresql
      comment: "Allow External User Support to assign roles to external users"
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO role_permission (app_role_id, permission)
              SELECT id, 'ASSIGN_EXTERNAL_USER_ROLES'
              FROM app_role
              WHERE name = 'External User Support'
                AND NOT EXISTS (
                  SELECT 1
                  FROM role_permission
                  WHERE app_role_id = app_role.id
                    AND permission = 'ASSIGN_EXTERNAL_USER_ROLES'
                );
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DELETE FROM role_permission
              WHERE app_role_id = (SELECT id FROM app_role WHERE name = 'External User Support')
                AND permission = 'ASSIGN_EXTERNAL_USER_ROLES';

  - changeSet:
      id: add-user-entra-id-and-modify-user-profile-id
      author: suresh kavali

      changes:
        - addColumn:
            tableName: user_activation_request
            columns:
              - column:
                  name: user_entra_id
                  type: UUID

        - dropNotNullConstraint:
            tableName: user_activation_request
            columnName: user_profile_id
            columnDataType: UUID

        - createIndex:
            tableName: user_activation_request
            indexName: idx_user_activation_request_request_id
            columns:
              - column:
                  name: request_id

        - createIndex:
            tableName: user_activation_request
            indexName: idx_user_activation_request_user_entra_id
            columns:
              - column:
                  name: user_entra_id

        - createIndex:
            tableName: user_activation_request
            indexName: idx_user_activation_request_actor_entra_oid
            columns:
              - column:
                  name: actor_entra_oid

      rollback:
        - dropIndex:
            tableName: user_activation_request
            indexName: idx_user_activation_request_actor_entra_oid

        - dropIndex:
            tableName: user_activation_request
            indexName: idx_user_activation_request_user_entra_id

        - dropIndex:
            tableName: user_activation_request
            indexName: idx_user_activation_request_request_id

        - dropColumn:
            tableName: user_activation_request
            columnName: user_entra_id

        - addNotNullConstraint:
            tableName: user_activation_request
            columnName: user_profile_id
            columnDataType: UUID
