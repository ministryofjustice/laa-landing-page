databaseChangeLog:
  - changeSet:
      id: 20260806-1-create-external-user-support-role
      author: paul.snowdon
      dbms: postgresql
      comment: "Create External User Support role combining Manage Your Users and SiLAS Administration permissions for support staff"
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO app_role (app_id, id, name, description, user_type_restriction, authz_role, ccms_code, legacy_sync, ordinal, firm_type_restriction)
              SELECT (SELECT id FROM app WHERE name = 'Manage your users'),
                     gen_random_uuid(),
                     'External User Support',
                     'An internal user able to investigate and resolve user-access issues, combining key user-management and SiLAS administration permissions',
                     ARRAY['INTERNAL'],
                     true,
                     NULL,
                     false,
                     0,
                     NULL
              WHERE NOT EXISTS (
                SELECT 1 FROM app_role WHERE name = 'External User Support'
              );
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO role_permission (app_role_id, permission)
              SELECT (SELECT id FROM app_role WHERE name = 'External User Support'), permission
              FROM (VALUES
                ('VIEW_INTERNAL_USER'),
                ('VIEW_EXTERNAL_USER'),
                ('CREATE_EXTERNAL_USER'),
                ('EDIT_EXTERNAL_USER'),
                ('EDIT_USER_OFFICE'),
                ('EDIT_USER_DETAILS'),
                ('EDIT_USER_FIRM'),
                ('DELEGATE_EXTERNAL_USER_ACCESS_INTERNAL'),
                ('CONVERT_USER_TO_MULTI_FIRM'),
                ('DISABLE_EXTERNAL_USER'),
                ('DELETE_EXTERNAL_USER'),
                ('CAN_REQUEST_DELEGATE_ENABLE_USER'),
                ('CAN_TRACK_DELEGATE_ACTIVATION_REQUESTS'),
                ('CAN_MANAGE_DELEGATE_ENABLE_USER'),
                ('VIEW_AUDIT_TABLE'),
                ('VIEW_FIRM_DIRECTORY'),
                ('CREATE_LAA_APP_ROLE'),
                ('DELETE_LAA_APP_ROLE'),
                ('EDIT_LAA_APP_METADATA'),
                ('EDIT_LAA_APP_ROLE_ASSIGN_RESTRICTIONS'),
                ('TRIGGER_CCMS_ROLE_SYNC'),
                ('TRIGGER_LAA_APP_SYNC'),
                ('VIEW_LAA_APP_METADATA')
              ) AS required_permissions(permission)
              WHERE NOT EXISTS (
                SELECT 1 FROM role_permission
                WHERE app_role_id = (SELECT id FROM app_role WHERE name = 'External User Support')
                  AND permission = required_permissions.permission
              );
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO role_assignment (assignable_role_id, assigning_role_id)
              SELECT (SELECT id FROM app_role WHERE name = 'External User Support'), assigning.id
              FROM app_role assigning
              WHERE assigning.name IN ('Global Admin', 'Internal User Manager')
                AND NOT EXISTS (
                  SELECT 1 FROM role_assignment ra
                  WHERE ra.assignable_role_id = (SELECT id FROM app_role WHERE name = 'External User Support')
                    AND ra.assigning_role_id = assigning.id
                );
      rollback:
        - sql:
            dbms: postgresql
            sql: "DELETE FROM role_assignment WHERE assignable_role_id = (SELECT id FROM app_role WHERE name = 'External User Support');"
        - sql:
            dbms: postgresql
            sql: "DELETE FROM role_permission WHERE app_role_id = (SELECT id FROM app_role WHERE name = 'External User Support');"
        - sql:
            dbms: postgresql
            sql: "DELETE FROM app_role WHERE name = 'External User Support';"
