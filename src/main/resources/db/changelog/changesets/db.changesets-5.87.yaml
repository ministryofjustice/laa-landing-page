databaseChangeLog:
  - changeSet:
      id: create-role-change-outbox
      author: suresh kavali
      comment: Create transactional outbox table and partial indexes for role change events
      changes:
        - createTable:
            tableName: role_change_outbox
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_role_change_outbox
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_role_change_outbox_event_id
              - column:
                  name: profile_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_role_change_outbox_profile_id
                    referencedTableName: user_profile
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: application_oid
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: lease_owner
                  type: UUID
              - column:
                  name: lease_until
                  type: TIMESTAMPTZ
              - column:
                  name: delivered_at
                  type: TIMESTAMPTZ
        - sql:
            sql: |
              ALTER TABLE role_change_outbox
                ADD CONSTRAINT chk_role_change_outbox_user_type CHECK (user_type IN ('INTERNAL', 'EXTERNAL')),
                ADD CONSTRAINT chk_role_change_outbox_attempts CHECK (attempts >= 0),
                ADD CONSTRAINT chk_role_change_outbox_lease CHECK ((lease_owner IS NULL) = (lease_until IS NULL));

              CREATE INDEX role_outbox_pending_idx ON role_change_outbox (next_attempt_at, id)
                WHERE delivered_at IS NULL;

              CREATE INDEX role_outbox_group_idx ON role_change_outbox (group_id, id)
                WHERE delivered_at IS NULL;

              CREATE INDEX role_outbox_profile_idx ON role_change_outbox (profile_id)
                WHERE delivered_at IS NULL;
      rollback:
        - dropIndex:
            indexName: role_outbox_profile_idx
            tableName: role_change_outbox
        - dropIndex:
            indexName: role_outbox_group_idx
            tableName: role_change_outbox
        - dropIndex:
            indexName: role_outbox_pending_idx
            tableName: role_change_outbox
        - dropTable:
            tableName: role_change_outbox
