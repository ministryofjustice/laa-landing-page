databaseChangeLog:
  - changeSet:
      id: add-enable-external-user-permission-to-security-response
      author: suresh kavali
      changes:
        - sql:
            comment: Assign ENABLE_EXTERNAL_USER permission to the Security Response role
            sql: |
              INSERT INTO role_permission (app_role_id, permission)
              VALUES (
                (SELECT id FROM app_role WHERE name = 'Security Response'),
                'ENABLE_EXTERNAL_USER'
              );
      rollback:
        - sql:
            sql: |
              DELETE FROM role_permission
              WHERE permission = 'ENABLE_EXTERNAL_USER'
                AND app_role_id = (SELECT id FROM app_role WHERE name = 'Security Response');
