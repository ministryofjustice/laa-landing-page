<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(
      title=~{::title},
      mainContent=~{::#main-content},
      pageCategory=${'manage-user'},
      breadcrumbs=~{::#breadcrumbs})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage User</title>
</head>
<body>
    <nav aria-label="Breadcrumb" class="govuk-breadcrumbs" id="breadcrumbs">
        <ol class="govuk-breadcrumbs__list">
            <li class="govuk-breadcrumbs__list-item">
                <a class="govuk-breadcrumbs__link" th:href="@{/admin/users(backButton=true)}">Back to manage your users</a>
            </li>
        </ol>
    </nav>
    <main class="govuk-main-wrapper" id="main-content">
        <div th:if="${roleAssignmentSuccess}" class="govuk-notification-banner govuk-notification-banner--success" role="status">
            <div class="govuk-notification-banner__content">
                <p class="govuk-notification-banner__heading" th:text="${roleAssignmentSuccess}"></p>
            </div>
        </div>
        <div class="moj-page-header-actions">
            <div class="moj-page-header-actions__title">
                <h1 class="govuk-heading-xl" th:text="${profile.fullName()}"></h1>
            </div>
            <form th:replace="~{manage-user :: manageAccessAction}"></form>
            <a th:if="${showApiRoleAssignment}" class="govuk-button"
               th:href="@{/admin/users/manage/{id}/assign-roles(id=${profile.userProfileId()})}">Edit access</a>
        </div>
        <h2 class="govuk-heading-m">User details</h2>
        <p th:if="${canDeleteUser}" class="govuk-body">
            <a class="govuk-link" th:href="@{/admin/users/manage/{id}/delete(id=${profile.userProfileId()})}">Delete user</a>
        </p>
        <dl class="govuk-summary-list">
            <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key">Email address</dt>
                <dd class="govuk-summary-list__value" th:text="${profile.email()}"></dd>
            </div>
            <div class="govuk-summary-list__row">
                <dt class="govuk-summary-list__key">User type</dt>
                <dd class="govuk-summary-list__value" th:text="${profile.userType().name() == 'EXTERNAL' ? 'External' : 'Internal'}"></dd>
            </div>
            <div class="govuk-summary-list__row" th:if="${profile.firmName() != null or profile.firmId() != null}">
                <dt class="govuk-summary-list__key">Firm</dt>
                <dd class="govuk-summary-list__value" th:text="${profile.firmName() ?: profile.firmId()}"></dd>
            </div>
        </dl>
        <h2 class="govuk-heading-m">Assigned roles</h2>
        <p class="govuk-body" th:if="${profile.roles().isEmpty()}">No roles assigned.</p>
        <ul class="govuk-list govuk-list--bullet" th:unless="${profile.roles().isEmpty()}">
            <li th:each="role : ${profile.roles()}" th:text="${role.appName() == null ? role.name() : role.appName() + ' - ' + role.name()}"></li>
        </ul>
        <h2 class="govuk-heading-m">Offices</h2>
        <p class="govuk-body" th:if="${profile.unrestrictedOfficeAccess()}">Access to all offices.</p>
        <p class="govuk-body" th:if="${!profile.unrestrictedOfficeAccess() and #lists.isEmpty(profile.offices())}">No offices assigned.</p>
        <ul class="govuk-list govuk-list--bullet"
            th:if="${!profile.unrestrictedOfficeAccess() and !#lists.isEmpty(profile.offices())}">
            <li th:each="office : ${profile.offices()}" th:text="${office.officeId()}"></li>
        </ul>
    </main>
</body>
</html>
