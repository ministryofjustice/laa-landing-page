<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(
      title=~{::title},
      mainContent=~{::#main-content},
      pageCategory=${'manage-access'},
      breadcrumbs=~{::#breadcrumbs})}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <title>${pageTitle}</title>
</head>

<body>
<nav aria-label="Breadcrumb" class="govuk-breadcrumbs" id="breadcrumbs">
    <a class="govuk-back-link govuk-!-margin-bottom-3"
       th:href="@{/admin/user/delegate-reactivate/{id}(id=${user.id}, referer=${referer}, profileId=${profileId})}">
        Back </a>
</nav>
<main class="govuk-main-wrapper" id="main-content">
    <div class="govuk-grid-row">
        <div class="govuk-grid-column-three-quarters">

            <div th:if="${errorMessage}" class="govuk-error-summary" role="alert" aria-labelledby="error-summary-title" tabindex="-1" data-module="govuk-error-summary">
                <h2 class="govuk-error-summary__title" id="error-summary-title">
                    There is a problem
                </h2>
                <div class="govuk-error-summary__body">
                    <ul class="govuk-list govuk-error-summary__list">
                        <li>
                            <a href="#reason-error" th:text="${errorMessage}"></a>
                        </li>
                    </ul>
                </div>
            </div>

            <h1 class="govuk-heading-l govuk-hint" th:text="'Reactivation request'">
                Reactivation request
            </h1>

            <h1 class="govuk-heading-l" th:text="${user.fullName}">
                User Full Name
            </h1>

            <h2 class="govuk-heading-m" th:text="'Review evidence'">
                Review evidence
            </h2>

            <p class="govuk-body">If required, you can respond to the request and ask for more information.</p>

            <div class="govuk-inset-text" th:each="req, iterStat : ${reactivationRequests}">
                <h2 class="govuk-heading-s" th:text="${req.actorName()}">
                    User Full Name (Role Name)
                </h2>
                <p class="govuk-body" th:text="${req.formattedCreatedAt()}">
                    Date
                </p>
                <p class="govuk-body govuk-!-margin-2" th:text="${req.comments()}">
                    Reason
                </p>

            </div>

            <form method="post" th:action="@{/admin/user/delegate-reactivate-user-reason/{id}(id=${user.id}, referer=${referer}, profileId=${profileId})}"
                  th:object="${delegateReactivateUserReasonForm}">

                <!-- Comments Field -->
                <div class="govuk-form-group govuk-!-width-full" id="comments-group">

                    <label class="govuk-label govuk-label--m" for="comments">
                        Please enter a reason (minimum 10 characters).
                    </label>

                    <textarea class="govuk-textarea govuk-!-margin-bottom-0"
                              id="comments"
                              name="comments"
                              rows="4"></textarea>

                    <p class="govuk-hint govuk-!-margin-top-0">You can enter up to 500 characters.</p>
                </div>

                <div class="govuk-button-group">
                    <button type="submit" class="govuk-button" data-module="govuk-button">
                        Continue
                    </button>
                    <a class="govuk-button govuk-button--secondary" th:href="@{/admin/users/manage/{id}(id=${profileId})}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>

</html>
