<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(
      title=~{::title},
      mainContent=~{::#main-content},
      pageCategory=${'manage-access'},
      breadcrumbs=~{::#breadcrumbs})}" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>${pageTitle}</title>
</head>

<body>
<nav aria-label="Breadcrumb" class="govuk-breadcrumbs" id="breadcrumbs">
    <a class="govuk-back-link" th:href="@{/admin/user/reactivate-reason/{id}(id=${user.id}, referer=${referer}, profileId=${profileId})}">
        Back </a>
</nav>
<main class="govuk-main-wrapper" id="main-content">
    <fieldset class="govuk-fieldset">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
            <h1 class="govuk-fieldset__heading">
                Check your answers and reactivate <span th:text="${user.fullName}"></span>
            </h1>
        </legend>
        <form th:action="@{/admin/user/reactivate-check-answers/{id}(id=${user.id}, referer=${referer}, profileId=${profileId})}" th:method="post" class="govuk-form">

            <div class="govuk-summary-card">
                <div class="govuk-summary-card__title-wrapper">
                    <h2 class="govuk-summary-card__title">
                        User details
                    </h2>
                </div>
                <div class="govuk-summary-card__content">
                    <dl class="govuk-summary-list">
                        <div class="govuk-summary-list__row">
                            <dt class="govuk-summary-list__key">Email</dt>
                            <dd class="govuk-summary-list__value">
                                <span th:text="${user.email}"></span>
                            </dd>
                        </div>
                        <div class="govuk-summary-list__row">
                            <dt class="govuk-summary-list__key">First name</dt>
                            <dd class="govuk-summary-list__value">
                                <span th:text="${user.firstName}"></span>
                            </dd>
                        </div>
                        <div class="govuk-summary-list__row">
                            <dt class="govuk-summary-list__key">Last name</dt>
                            <dd class="govuk-summary-list__value">
                                <span th:text="${user.lastName}"></span>
                            </dd>
                        </div>
                    </dl>
                </div>
            </div>

            <div class="govuk-summary-card">
                <div class="govuk-summary-card__title-wrapper">
                    <h2 class="govuk-summary-card__title">
                        Reactivation details
                    </h2>
                </div>
                <div class="govuk-summary-card__content">
                    <dl class="govuk-summary-list">
                        <div class="govuk-summary-list__row">
                            <dt class="govuk-summary-list__key">Reason</dt>
                            <dd class="govuk-summary-list__value">
                                <span th:text="${reactivateUserReasonForm.reason}"></span>
                            </dd>
                            <dd class="govuk-summary-list__actions">
                                <a th:href="@{/admin/user/reactivate-reason/{id}(id=${user.id}, referer=${referer}, profileId=${profileId})}" class="govuk-link">
                                    Change
                                    <span class="govuk-visually-hidden"> reason</span>
                                </a>
                            </dd>
                        </div>
                    </dl>
                </div>
            </div>

            <p class="govuk-body">Selecting "Reactivate user" will immediately reactivate the account and approve the
                associated reactivation request.</p>

            <div class="govuk-button-group">
                <button type="submit" class="govuk-button" data-module="govuk-button" data-prevent-double-click="true">Reactivate user</button>
                <a class="govuk-button govuk-button--secondary" th:href="@{/admin/users/manage/{id}(id=${profileId})}">Cancel</a>
            </div>
        </form>
    </fieldset>
</main>
</body>

</html>
