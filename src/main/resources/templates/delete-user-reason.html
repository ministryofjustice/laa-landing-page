<!DOCTYPE html>
<html lang="en" th:replace="~{layout :: layout(
      title=~{::title},
      mainContent=~{::#main-content},
      pageCategory=${'delete-user-reason'},
      breadcrumbs=~{::#breadcrumbs})}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${'Remove access - ' + user.fullName}">Remove access</title>
</head>
<body>
<main class="govuk-main-wrapper" id="main-content">
    <div th:if="${globalErrorMessage}">
        <div class="govuk-error-summary" role="alert" aria-labelledby="error-summary-title"
             aria-describedby="error-summary-description" data-module="govuk-error-summary">
            <h2 class="govuk-error-summary__title" id="error-summary-title">
                There is a problem
            </h2>
            <div class="govuk-error-summary__body" id="error-summary-description">
                <ul class="govuk-list govuk-error-summary__list">
                    <li th:text="${globalErrorMessage}"></li>
                </ul>
            </div>
        </div>
    </div>

    <a class="govuk-back-link" th:href="@{/admin/users/manage/{id}(id=${user.id})}">Back</a>

    <h1 class="govuk-heading-l">
        Select why you need to delete <span th:text="${user.fullName}"></span>?
    </h1>

    <div class="govuk-warning-text">
        <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
        <strong class="govuk-warning-text__text">
            <span class="govuk-visually-hidden">Warning</span>
            Deleting a user account is a permanent action. If you want to
            temporarily suspend a user's access, you can deactivate them
            instead.
        </strong>
    </div>

    <!-- nosemgrep -->
    <form th:action="@{/admin/users/manage/{id}/delete(id=${user.id})}" method="post" novalidate>
        <div class="govuk-form-group" th:classappend="${fieldErrorMessage} ? ' govuk-form-group--error'">
            <fieldset class="govuk-fieldset" th:attrappend="aria-describedby=${fieldErrorMessage != null ? 'reasonId-error' : null}">
                <span class="govuk-error-message" id="reasonId-error" th:if="${fieldErrorMessage}">
                    <span class="govuk-visually-hidden">Error:</span>
                    <span th:text="${fieldErrorMessage}"></span>
                </span>
                <div class="govuk-radios" data-module="govuk-radios">
                    <div class="govuk-radios__item" th:each="reason : ${deleteReasons}">
                        <input class="govuk-radios__input" type="radio"
                               th:id="${reason.id}" name="reasonId"
                               th:value="${reason.id}">
                        <label class="govuk-label govuk-radios__label" th:for="${reason.id}"
                               th:text="${reason.label}"></label>
                    </div>
                </div>
            </fieldset>
        </div>

        <div class="moj-button-group">
            <button type="submit" class="govuk-button" data-module="govuk-button">
                Continue
            </button>
            <a class="govuk-link" th:href="@{/admin/users/manage/{id}(id=${user.id})}">Cancel</a>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>
</main>
</body>
</html>
