<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!--
    Reusable search + filter panel component. It is fully generic - any page can supply its own
    set of filter checkboxes/param names, not just the User Type / Status filters used on the
    users page (e.g. a "Track reactivation requests" page could pass its own User Type and
    Request Status filters with different param names).

    Parameters:
      formAction          - th:action URL for the search form  (e.g. @{/admin/users})
      searchHint          - hint text shown below the "Search users" heading
      filterContent       - fragment expression for the filter checkboxes  (~{:: #my-filter-content})
      activeFiltersContent- fragment expression for the active-filters banner (~{:: #my-active-filters})

    The caller template should wrap the two inline fragment definitions inside the th:replace block:

        <th:block th:replace="~{shared-components/search-filter :: searchFilter(
            formAction=@{/admin/users},
            searchHint='You can search by user name, email, firm name, or firm code.',
            filterContent=~{:: #my-filter-content},
            activeFiltersContent=~{:: #my-active-filters}
        )}">
            <div id="my-filter-content">
                ... page-specific filter checkboxes (any name/value attributes you like) ...
            </div>
            <div id="my-active-filters">
                ... page-specific active filters banner (may be empty / th:if guarded) ...
            </div>
        </th:block>

    Conventions used by the shared script below when building the active-filters banner
    (activeFiltersContent) - these work with ANY param names, so a page can define its own
    filters that are entirely different from the users page:

      - Single-value filter tag (checkbox/text param):
          <a href="#" data-remove-filter="myParamName">...</a>

      - Multi-value filter tag (repeated checkbox param, e.g. selectedStatuses):
          <a href="#" data-remove-array-param="myParamName" data-remove-array-value="THE_VALUE">...</a>

      - "Clear filters" link - list every filter param used on the page (comma separated) so it
        knows what to strip from the URL:
          <a href="#" id="clear-filters-link" data-filter-params="myParam1,myParam2,myArrayParam">Clear filters</a>
-->

<th:block th:fragment="searchFilter(formAction, searchHint, filterContent, activeFiltersContent)">

    <form method="get" th:action="${formAction}" id="search-filter-form" aria-label="Search and filter users">
        <input type="hidden" name="page" value="1">
        <input th:if="${requestedPageSize != null and requestedPageSize != 10}" type="hidden" name="size" th:value="${requestedPageSize}">
        <input th:if="${sort != null and sort != ''}" type="hidden" name="sort" th:value="${sort}">
        <input th:if="${direction != null and direction != ''}" type="hidden" name="direction" th:value="${direction}">

        <div class="search-card">
            <div class="govuk-form-group">
                <fieldset class="govuk-fieldset">
                    <legend class="govuk-fieldset__legend govuk-fieldset__legend--m">
                        <h2 class="govuk-fieldset__heading">Search users</h2>
                    </legend>
                    <div class="govuk-hint" th:text="${searchHint}">Search users</div>

                    <div class="search-inputs-container">
                        <div class="search-input-group">
                            <div class="govuk-form-group">
                                <input class="govuk-input" id="search" name="search" type="search"
                                       th:value="${search}" autocomplete="off">
                            </div>
                        </div>
                        <div class="search-button-group">
                            <button type="submit" class="govuk-button" data-module="govuk-button">
                                Search
                            </button>
                        </div>
                        <div class="search-button-group">
                            <button type="button" id="toggle-filters-btn"
                                    class="govuk-button govuk-button--secondary"
                                    aria-expanded="false" aria-controls="filter-panel">
                                Show filters
                            </button>
                        </div>
                    </div>
                </fieldset>
            </div>

            <!-- Collapsible filter panel -->
            <div id="filter-panel" hidden style="margin-top: 15px;">
                <div class="filter-panel-content">
                    <div class="filter-panel-header">
                        <p class="govuk-body govuk-!-font-weight-bold govuk-!-margin-bottom-0">Filters</p>
                    </div>
                    <div class="filter-panel-body">
                        <!-- Page-specific filter checkboxes -->
                        <th:block th:replace="${filterContent}"/>

                        <button type="submit" class="govuk-button govuk-!-margin-top-3 govuk-!-margin-bottom-0">
                            Apply filters
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <!-- Page-specific active filters banner -->
    <th:block th:replace="${activeFiltersContent}"/>

    <style>
        .search-card { padding-right: 0; border-radius: 0; }
        .search-card > .govuk-form-group { margin-bottom: 0; }
        .search-card .govuk-fieldset { padding-bottom: 10px; margin-bottom: 0; }
        .search-card .govuk-fieldset__legend { margin-bottom: 15px; }
        .search-card .govuk-hint { margin-bottom: 20px; }

        .search-inputs-container { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
        .search-input-group { flex: 1; min-width: 200px; }
        .search-input-group .govuk-form-group { margin-bottom: 0; }
        .search-button-group { flex: 0 0 auto; margin-bottom: 0; }
        .search-button-group .govuk-button { margin-bottom: 0; }

        @media (max-width: 768px) {
            .search-inputs-container { flex-direction: column; align-items: stretch; gap: 10px; }
            .search-input-group { min-width: 100%; }
        }

        .filter-panel-content { border: 1px solid #b1b4b6; margin: 0; padding: 0; }
        .filter-panel-header { background-color: #f3f2f1; padding: 8px 20px; border-bottom: 1px solid #b1b4b6; font-size: 19px; line-height: 1.31579; }
        .filter-panel-header p { margin: 0; }
        .filter-panel-body { background-color: #ffffff; padding: 20px 20px 20px 20px; }
    </style>

    <script th:src="@{/js/utils/url-utils.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // --- Filter panel toggle ---
            const toggleBtn = document.getElementById('toggle-filters-btn');
            const filterPanel = document.getElementById('filter-panel');
            const hasActiveFilters = document.querySelector('.active-filters-banner') !== null;

            function setFilterExpanded(expanded) {
                if (expanded) {
                    filterPanel.removeAttribute('hidden');
                    toggleBtn.setAttribute('aria-expanded', 'true');
                    toggleBtn.textContent = 'Hide filters';
                    toggleBtn.classList.remove('govuk-button--secondary');
                    toggleBtn.classList.add('govuk-button--yellow');
                } else {
                    filterPanel.setAttribute('hidden', '');
                    toggleBtn.setAttribute('aria-expanded', 'false');
                    toggleBtn.textContent = 'Show filters';
                    toggleBtn.classList.remove('govuk-button--yellow');
                    toggleBtn.classList.add('govuk-button--secondary');
                }
            }

            if (toggleBtn && filterPanel) {
                if (hasActiveFilters) { setFilterExpanded(true); }
                toggleBtn.addEventListener('click', function () {
                    setFilterExpanded(this.getAttribute('aria-expanded') !== 'true');
                });
            }

            // --- Active filter tag remove links ---
            document.querySelectorAll('[data-remove-filter]').forEach(function (link) {
                const filterName = link.dataset.removeFilter;
                const url = new URL(window.location.href);
                url.searchParams.delete(filterName);
                url.searchParams.set('page', '1');
                link.href = url.toString();
            });

            // Generic multi-value filter tag removal - works for any repeated param name
            // (e.g. selectedStatuses, selectedRequestStatuses), not just the users page.
            document.querySelectorAll('[data-remove-array-param]').forEach(function (link) {
                const paramName = link.dataset.removeArrayParam;
                const value = link.dataset.removeArrayValue;
                const url = new URL(window.location.href);
                const remaining = url.searchParams.getAll(paramName).filter(v => v !== value);
                url.searchParams.delete(paramName);
                remaining.forEach(v => url.searchParams.append(paramName, v));
                url.searchParams.set('page', '1');
                link.href = url.toString();
            });

            const clearFiltersLink = document.getElementById('clear-filters-link');
            if (clearFiltersLink) {
                const url = new URL(window.location.href);
                // Filter param names come from the page-specific data-filter-params attribute,
                // so each page can declare its own set of filters to clear.
                const filterParams = (clearFiltersLink.dataset.filterParams || '')
                    .split(',').map(p => p.trim()).filter(Boolean);
                filterParams.forEach(p => url.searchParams.delete(p));
                url.searchParams.set('page', '1');
                clearFiltersLink.href = url.toString();
            }

            // --- Form submission: build clean URL with array support ---
            const searchFilterForm = document.getElementById('search-filter-form');
            if (searchFilterForm) {
                searchFilterForm.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const url = new URL(this.action || window.location.pathname, window.location.origin);
                    url.search = '';
                    const sp = url.searchParams;
                    const formData = new FormData(searchFilterForm);

                    // Generic handling of any repeated checkbox param name (e.g. selectedStatuses
                    // on the users page, or a differently-named multi-value filter on another page)
                    const seenKeys = new Set();
                    for (const key of formData.keys()) {
                        if (seenKeys.has(key)) continue;
                        seenKeys.add(key);
                        const values = formData.getAll(key).filter(v => typeof v === 'string' && v.trim() !== '');
                        if (values.length === 0) continue;
                        if (key === 'size' && values[0] == 10) continue;
                        if (key === 'page' && values[0] == 1) continue;
                        values.forEach(v => sp.append(key, v));
                    }
                    window.location.href = url.toString();
                });
            }
        });
    </script>

</th:block>

</body>
</html>
